[project]
name = "goe-prometheus"
version = "0.2.2"
description = ""
authors = [{ name = "Michael Helmling", email = "michaelhelmling@posteo.de" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
    "prometheus-client>=0.17.1,<0.18",
    "pyyaml>=6.0.1,<7",
    "goe>=0.2.2,<0.3",
]

[project.scripts]
export = "goe_prometheus.__main__:run"

[tool.hatch.build.targets.sdist]
include = ["goe_prometheus"]

[tool.hatch.build.targets.wheel]
include = ["goe_prometheus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
